# SINQ SANS-I instrument file (pySASred). Values that are not yet confirmed
# carry `uncertainty: null` and are marked "to confirm"; null uncertainty
# means "not propagated" and is listed as such in every output.
instrument: SANS-I
facility: SINQ, PSI
reader: sinq_sans_i
detector:
  type: 3He multiwire, 128 x 128
  pixel_size_m: [0.0075, 0.0075]        # read from file; used to check it
  construction:                          # from J. Kohlbrecher, 2026-10-26 (null: still to confirm)
    window: {material: Al, thickness_m: 0.007, diameter_m: 1.300, radius_of_curvature_m: 0.930,
             apex_to_detector_m: 0.265}  # dome convex towards the sample, apex 26.5 cm in front of the detection plane (confirmed)
    fill_gas: {gas: 4He, pressure_bar: 2.7, path_m: null}         # between dome window and membrane
    membrane: {material: Al, shape: flat, thickness_m: 0.002}   # separates 4He from the detection gas
    detection_gas: {gas: 3He, pressure_bar: 2.7, stopping_gas: CF4, stopping_pressure_bar: null,
                    active_depth_m: null, inactive_layer_m: null}
    distance_reference: null             # which plane the recorded SD refers to
    temperature_K: 293.0
  deadtime:
    model: nonparalysable
    rate: global                         # multiwire: one rate for the detector
    tau_s: 6.6e-7                        # BerSANS and DarePy; GRASP uses 6.0e-7 (to confirm)
    uncertainty_s: null
    flag_factor: 1.2
collimation:                             # divergence estimate when a geometry has no direct beam (core.beamprofile)
  source_aperture_mm: [50, 50]           # neutron guide cross-section (x, y) at the start of the collimation coll
  sample_aperture_mm: [8, 14]            # typical sample aperture (x, y); the real one is not in the file
monitor:
  normaliser: monitor1                   # BerSANS 2026 used Moni1, 2024 Moni2, DarePy monitor2
  # Is the normaliser behind the velocity selector? Only then does it cancel a change of the selector
  # setting (tilt: flux ~ dλ/λ). null: unknown – then determined from the data when the folder has runs at
  # two wavelengths or tilts (core.monitors.selector_test: a monitor before the selector keeps its ratio to
  # the proton beam, integrated_beam).
  # AgBe 2025 (runs 1964-1980, 8.3 / 11.7 / 16.4 / 50 / 57.5 Å and the selector speed scans 1976, 1980):
  # monitor1 = monitor4 behind the selector (ratio to the proton beam changes by a factor 3-15);
  # monitor2 and monitor_7 in front of it (constant within 0.7 %); monitor_5 = integrated_beam (protons).
  normaliser_after_selector: true
  deadtime:
    tau_s: 0.0                           # factor 1.0252 in the BerSANS copy suggests ~3.3 us (to confirm)
    uncertainty_s: null
beamstop:                                # motor positions bsx, bsy in mm (read from file)
  x_sign: 1                              # +1: bsx grows with the detector pixel x (to confirm)
  y_sign: 1                              # +1: bsy grows with the detector pixel y (to confirm)
attenuator:                              # transmission factors by selector index (DarePy table)
  "0": {transmission: 1.0, uncertainty: 0.0}
  "1": {transmission: 0.002061856, uncertainty: null,   # ~1/485 from the sieve hole diameters (nominal)
        water_check: {wavelength_nm: 0.6, transmission: 0.00164, uncertainty_rel: 0.02,
                      source: "Vifor 2026-09, 8 m and 2 m water (g(λ), BerSANS denominator) vs empty beam 82173/82221/82269"}}
        # water check gives ~1/610: the nominal value is 26 % too high at 0.6 nm (inhomogeneous sieve illumination?);
        # to be reconfirmed by tests. Absolute scale from the attenuated direct beam is then 26 % too low.
  "2": {transmission: 0.011363636, uncertainty: null}   # ~1/88
  "3": {transmission: 0.125, uncertainty: null}         # ~1/8
  "4": {transmission: 0.285714286, uncertainty: null}   # ~1/3.5
  "5": {transmission: 0.120481928, uncertainty: null}   # ~1/8.3
wavelength:
  distribution: triangular               # Dornier velocity selector
  dlam_over_lam_fwhm_default: null        # read from file; else the user must give it
  # dλ/λ (FWHM) of the Dornier selector depends only on its tilt angle (SANS/Dornier-VS/tilt, 0 ... -10 deg).
  # When the file has the tilt, dλ/λ comes from this table (monotone cubic interpolation), not from
  # SANS/monochromator/wavelength_spread (a fixed number in the files).
  selector_tilt:
    tilt_deg:           [-10, -8, -6, -4, -2, 0]
    dlam_over_lam_fwhm: [0.27177, 0.20619, 0.1579, 0.12666, 0.1081, 0.09832]
    source: "SANS-I selector calibration (J. Kohlbrecher, 2026-11)"
water:                                   # calibration standard
  g_lambda:                              # forward excess K0 of the water (Strunz et al. 2000, eq. 6), λ in nm
    formula: [1.36992, 0.31389, -1.07706, 0.54662]   # g = c0 + c1 λ + c2 λ² + c3 λ³, least squares through the points
    # previous quadratic in use at SANS-I: [1.642, -0.7825, 0.3159]
    measured_nm: [0.47, 0.60, 0.80, 1.00, 1.20]
    measured: [1.338, 1.284, 1.217, 1.150, 1.141]
    range_nm: [0.47, 1.20]
    uncertainty_rel: 0.006               # fit uncertainty of the cubic inside 0.47-1.2 nm (0.5-0.7 %; rms residual 0.3 %)
  denominator: water_and_cell            # water factor g A_W (1 - T_W/T_EC)/(4π D): water_and_cell → D = T_W (BerSANS, used at
                                         # SANS-I with this g(λ)); tau → D = τ_W = T_W/T_EC (Strunz eq. 8), 1/T_EC lower
