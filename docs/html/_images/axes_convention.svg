<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" width="1010" height="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
  </defs>
  <rect x="0" y="0" width="1010" height="500" fill="white"/>
  <text x="20" y="30" font-size="16" font-weight="bold">(a) Lab frame: right-handed, as NXcanSAS / McStas</text>
<line x1="20.0" y1="300.0" x2="570.0" y2="300.0" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="509.5,451.8 630.5,368.2 630.5,148.2 509.5,231.8" fill="#eef3fb" fill-opacity="0.85" stroke="#1f5fbf" stroke-width="2"/>
<line x1="570.0" y1="300.0" x2="690.0" y2="300.0" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="163.4,324.6 176.6,315.4 176.6,275.4 163.4,284.6" fill="#d9b38c" stroke="#7a5230"/>
<line x1="170.0" y1="300.0" x2="340.0" y2="300.0" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
<line x1="170.0" y1="300.0" x2="170.0" y2="180.0" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
<line x1="170.0" y1="300.0" x2="252.5" y2="243.0" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
<line x1="622.2" y1="355.9" x2="517.8" y2="428.1" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ahb)"/>
  <text x="22" y="292" fill="#555">neutrons</text>
  <text x="120" y="345" fill="#7a5230">sample</text>
  <text x="560" y="140" fill="#1f5fbf">detector</text>
  <text x="300" y="322" fill="#c0392b" font-weight="bold">z  beam, downstream</text>
  <text x="178" y="178" fill="#c0392b" font-weight="bold">y  up</text>
  <text x="258" y="236" fill="#c0392b" font-weight="bold">x = y × z  horizontal</text>
  <text x="258" y="254" fill="#c0392b">(into the page: to the LEFT</text>
  <text x="258" y="272" fill="#c0392b">as seen from the sample)</text>
  <text x="250" y="470" fill="#1f5fbf">raw column index of SANS-I / SANS-LLB:</text>
  <text x="250" y="488" fill="#1f5fbf">to the RIGHT as seen from the sample (towards −x)</text>
  <circle cx="738" cy="262" r="15" fill="none" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="731" cy="259" r="2.5" fill="#2e8b57"/>
  <line x1="721" y1="270" x2="650" y2="282" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#ahg)"/>
  <text x="660" y="335" fill="#2e8b57">2D views look</text>
  <text x="660" y="353" fill="#2e8b57">towards the</text>
  <text x="660" y="371" fill="#2e8b57">sample</text>

  <text x="790" y="30" font-size="16" font-weight="bold">(b) Every 2D view</text>
  <rect x="790" y="50" width="200" height="200" fill="#eef3fb" stroke="#1f5fbf" stroke-width="2"/>
  <line x1="890" y1="150" x2="980" y2="150" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ahr)"/>
  <text x="952" y="142" fill="#c0392b" font-weight="bold">q_x</text>
  <line x1="890" y1="150" x2="890" y2="60" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ahr)"/>
  <text x="898" y="74" fill="#c0392b" font-weight="bold">q_y</text>
  <circle cx="890" cy="150" r="7" fill="white" stroke="#c0392b" stroke-width="2"/>
  <circle cx="890" cy="150" r="2" fill="#c0392b"/>
  <text x="800" y="176" fill="#c0392b" font-size="12">beam (z) out of</text>
  <text x="800" y="190" fill="#c0392b" font-size="12">the screen</text>
  <line x1="890" y1="150" x2="948" y2="104" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
  <text x="950" y="100" fill="#222">q</text>
  <path d="M 926 150 A 36 36 0 0 0 918.2 127.6" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="930" y="138" fill="#222">ψ</text>
  <line x1="978" y1="236" x2="804" y2="236" stroke="#1f5fbf" stroke-width="2" marker-end="url(#ahb)"/>
  <text x="808" y="229" fill="#1f5fbf" font-size="12">raw columns (SINQ)</text>
  <text x="790" y="280" font-size="13">q_x right, q_y up</text>
  <text x="790" y="298" font-size="13">ψ (φ) from +q_x towards +q_y:</text>
  <text x="790" y="316" font-size="13">counter-clockwise = right-hand</text>
  <text x="790" y="334" font-size="13">rotation about the beam</text>
  <text x="790" y="352" font-size="13">q = q (cos ψ, sin ψ, ≈0)</text>
  <text x="790" y="380" font-size="13">magnetic field: azimuth ψ_H</text>
  <text x="790" y="398" font-size="13">in the same sense (0 = +q_x)</text>
  <text x="790" y="416" font-size="13">spin '+' parallel to H</text>
</svg>
