[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysasfit"
version = "0.2.0"
description = "Python tools for small-angle scattering from the SASfit project: SASfit plugin functions, Ornstein-Zernike structure factors, SLD profiles, size distributions and p(r) by inversion, 3D two- and multi-phase morphologies (SASmorph), shared resolution/background/IO."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Joachim Kohlbrecher", email = "joachim.kohlbrecher@psi.ch" }]
keywords = ["small-angle scattering", "SANS", "SAXS", "SASfit", "SLD profile",
            "size distribution", "pair distance distribution", "indirect Fourier transform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
gui = ["PySide6>=6.5", "matplotlib>=3.7"]
# Ornstein-Zernike extras: mpmath (high-precision Golub-Welsch nodes for log-normal and Weibull
# size distributions), sundials4py (KINSOL solvers), bumps (global fitting / DREAM), mixscatter
# (analytic Vrij mixture reference in the validation tab), openpyxl (Excel export)
oz = ["mpmath", "sundials4py", "bumps", "mixscatter", "openpyxl"]
# pySCAtter: mpmath for the excluded-volume chain series beyond q²Rg² = 5 (arbitrary precision)
scatter = ["mpmath"]
# optional compiled kernels (Numba, CPU, all cores) for the slow 2D cases of pySCAtter (boxes, superballs);
# under MSYS2 install it with pacman (mingw-w64-...-python-numba)
fast = ["numba"]
# optional optimisers of the studio fit panel (the panel lists those that are installed)
fit = ["nlopt", "bumps", "iminuit", "cma", "DFO-LS"]
# export of fit results from the studio fit panel: Excel workbook with charts, clipboard picture
export = ["openpyxl", "matplotlib>=3.7"]
# SANS data reduction (pySASred): HDF5 raw data and NXcanSAS output, instrument files
sasred = ["h5py>=3.8", "pyyaml>=6"]
# pyTOOLbox: HDF5 viewer and metadata lister (openpyxl for the Excel export of the listing)
toolbox = ["h5py>=3.8", "openpyxl"]
# pySASmorph: 3D panel (pyqtgraph + PyOpenGL, pure Python), HDF5 and TIFF-stack export; scikit-image
# (faster, smoother marching cubes) is optional -- under MSYS2 install it with pacman, not pip
morph = ["pyqtgraph>=0.13", "PyOpenGL", "h5py>=3.8", "tifffile"]
# optional separate PyVista/VTK window of pySASmorph (needs VTK wheels: standard python.org Python)
morph-pyvista = ["pyvista>=0.46.5", "pyvistaqt"]
# pyATsas: 3D panel of bead models and envelopes (pyqtgraph + PyOpenGL); ATSAS itself is installed separately
atsas = ["pyqtgraph>=0.13", "PyOpenGL"]
# pyDENsity: 3D panel; DENSS itself (GPL-3.0) is installed separately: pip install denss
density = ["pyqtgraph>=0.13", "PyOpenGL"]
# pyDENSSmulti: 3D panel (the reconstruction itself needs numpy and scipy only)
densitymulti = ["pyqtgraph>=0.13", "PyOpenGL"]
# pySLDcalculator: periodictable (neutron scattering lengths per isotope, Henke X-ray table, formula
# grammar, residue tables), xraydb (Chantler f', f'' with a fine grid at the absorption edges; edges)
sld = ["periodictable>=2.0", "xraydb>=4.5"]
sasbox = ["h5py>=3.8", "openpyxl"]        # old name of the toolbox extra
dev = ["pytest>=7.0", "matplotlib>=3.7", "PySide6>=6.5", "h5py>=3.8", "pyyaml>=6"]
# documentation: one Sphinx project in docs/ (Markdown via MyST and reStructuredText)
docs = ["sphinx>=7", "myst-parser>=2", "pydata-sphinx-theme>=0.15", "sphinx-design"]

[project.scripts]
pysasfit-gui = "pysasfit.gui.launcher:main"
pysasfit-sldprofile = "pysasfit.sldprofile.gui:main"
pysasfit-inversion = "pysasfit.inversion.gui.app:main"
pysasfit-studio = "pysasfit.studio.cli:main"
pysasfit-explorer = "pysasfit.studio.explorer:main"
pysasfit-scout = "pysasfit.scout.cli:main"
pysasfit-scout-gui = "pysasfit.scout.gui:main"
pysasfit-oz = "pysasfit.oz.gui.main_window:main"
pysasfit-sasred = "pysasfit.sasred.gui:main"
pysasfit-toolbox = "pysasfit.toolbox.gui:main"
pysasfit-morph = "pysasfit.morph.gui:main"
pysasfit-scatter = "pysasfit.scatter.gui:main"
pysasfit-seb = "pysasfit.seb.gui:main"
pysasfit-atsas = "pysasfit.atsas.gui:main"
pysasfit-density = "pysasfit.density.gui:main"
pysasfit-densitymulti = "pysasfit.densitymulti.gui:main"
pysasfit-sld = "pysasfit.sld.cli:main"
pysasfit-sasbox = "pysasfit.toolbox.gui:main"     # old name

[project.urls]
Repository = "https://github.com/SASfit/pySASfit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pysasfit.oz" = ["*.dll", "*.so", "*.dylib"]
"pysasfit.sasred.instruments.sinq" = ["*.yaml"]
"pysasfit.studio" = ["headers/*.h", "templates/*", "sasfit_lib/*", "sasfit_lib/plugins/*", "sasfit_lib/plugins/FrolovPoints/*"]

# logos and icons of the logo bundle, copied by tools/sync_logos.py (release.py runs it before the build)
"pysasfit.resources" = ["icons/*/*.svg", "icons/*/*.ico", "logos/*/svg/*.svg", "menu-icons/*/*.svg",
                        "menu-icons/*/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["reference: pySCAtter tests using the authors' reference weighting s=0",
           "atsas: needs a real ATSAS installation (skipped without one)",
           "denss: runs the real DENSS (skipped when it is not installed)",
           "pyseb: pySEBpolymers compared with pyseb (skipped when it is not installed)"]
